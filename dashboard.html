<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LuckyShop24 - ระบบสมาชิกและจัดการหลังบ้าน</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        :root {
            --navy: #1e293b;
            --navy-light: #334155;
            --accent: #4f46e5;
            --silver: #f1f5f9;
            --white: #ffffff;
        }
        body { 
            font-family: "Kanit", sans-serif; 
            background: var(--silver);
            margin: 0;
            min-height: 100vh;
        }
        #app { min-height: 100vh; display: flex; flex-direction: column; }
        
        /* สไตล์หน้าโหลดข้อมูล */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: var(--navy);
            color: white;
        }

        /* ปรับแต่ง Pop-up ทั้งระบบให้พรีเมียมโค้งมน */
        .swal2-popup { border-radius: 30px !important; padding: 2rem !important; border: none !important; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important; }
        .swal2-title { font-weight: 700 !important; color: var(--navy) !important; }
        .swal2-confirm { border-radius: 15px !important; padding: 12px 35px !important; font-weight: 600 !important; font-size: 1rem !important; }
        .swal2-cancel { border-radius: 15px !important; padding: 12px 35px !important; font-weight: 600 !important; }
        
        /* ปุ่มกากบาทปิดแจ้งเตือนขวาบน (X) */
        .swal2-close { 
            font-size: 2.5rem !important; 
            color: #94a3b8 !important; 
            outline: none !important;
            box-shadow: none !important;
            margin-top: 10px !important;
            margin-right: 10px !important;
        }
        .swal2-close:hover { color: #ef4444 !important; }

        div::-webkit-scrollbar { width: 5px; }
        div::-webkit-scrollbar-track { background: #f1f1f1; }
        div::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading-screen">
            <div class="spinner-border mb-3" style="width: 3rem; height: 3rem; color: #4f46e5; border-width: 0.3em;" role="status"></div>
            <h5 class="fw-bold" style="letter-spacing: 1px;">LUCKYSHOP24</h5>
            <p class="text-white-50 small">กำลังเชื่อมต่อฐานข้อมูล...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="app.js"></script>
</body>
</html>
